<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Personal portfolio" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="site.config.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section id="working-on" class="working-on" hidden>
        <p id="working-on-label" class="eyebrow">Working on</p>
        <div id="working-on-body"></div>
      </section>

      <header class="hero">
        <img id="site-avatar" class="avatar" alt="" hidden />
        <h1 id="site-name"></h1>
        <p class="role" id="site-role"></p>
        <p class="bio" id="site-bio"></p>
        <nav id="quick-links" class="quick-links" aria-label="Contact and social links"></nav>
      </header>

      <section class="skills" aria-labelledby="skills-heading">
        <h2 id="skills-heading">Skills</h2>
        <ul id="skills-list"></ul>
      </section>

      <section class="projects-section" aria-labelledby="projects-heading">
        <h2 id="projects-heading">Projects</h2>
        <div id="projects-list" class="projects"></div>
      </section>

      <footer class="site-footer">
        <p id="site-footer"></p>
      </footer>
    </main>
    <script src="js/site.js"></script>
  </body>
</html>
